<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة الموارد البشرية</title>
  <style>
    :root {
      --navy: #1e293b;
      --navy-light: #334155;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #dc2626;
      --success: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

    /* Login Screen */
    #login-screen {
      position: fixed; inset: 0; background: var(--navy); z-index: 1000;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .login-card {
      background: var(--card-bg); width: 100%; max-width: 400px; padding: 32px;
      border-radius: 16px; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
    }
    .login-card h2 { margin-bottom: 24px; color: var(--navy); text-align: center; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
    .form-control {
      width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; outline: none; transition: border-color 0.2s;
    }
    .form-control:focus { border-color: var(--primary); }
    .btn {
      width: 100%; padding: 12px; background: var(--primary); color: white; border: none;
      border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #b91c1c; }
    .btn-secondary { background: var(--text-muted); }

    /* Layout */
    .sidebar {
      width: 260px; background: var(--navy); color: white; display: flex; flex-direction: column;
      position: fixed; top: 0; bottom: 0; right: 0; z-index: 100; transition: transform 0.3s ease;
    }
    .sidebar-header { padding: 24px; font-size: 18px; font-weight: bold; border-bottom: 1px solid var(--navy-light); }
    .sidebar-menu { list-style: none; padding: 16px; flex: 1; }
    .sidebar-menu li { margin-bottom: 8px; }
    .sidebar-menu a {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #94a3b8;
      text-decoration: none; border-radius: 8px; font-weight: 500; transition: all 0.2s;
    }
    .sidebar-menu a:hover, .sidebar-menu a.active { background: var(--navy-light); color: white; }
    .sidebar-footer { padding: 16px; border-top: 1px solid var(--navy-light); }

    .main { flex: 1; margin-right: 260px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .topbar {
      height: 70px; background: var(--card-bg); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0;
    }
    .topbar-title { font-size: 20px; font-weight: bold; color: var(--navy); }
    .content { flex: 1; overflow-y: auto; padding: 24px; }

    /* Dashboard Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 24px; }
    .stat-card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 1px 3px rgb(0 0 0 / 0.05); }
    .stat-card h3 { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; }
    .stat-card .value { font-size: 28px; font-weight: bold; color: var(--navy); }

    /* Tables & Cards */
    .card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); padding: 20px; margin-bottom: 24px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .table-container { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: right; }
    th, td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { background: #f1f5f9; color: var(--navy); font-weight: 600; }
    tr:hover { background: #f8fafc; }

    /* Mobile drawer styles */
    .mobile-menu-btn {
      display: none; background: none; border: none; cursor: pointer; color: var(--navy); padding: 4px;
    }

    @media (max-width: 900px) {
      .sidebar {
        transform: translateX(100%);
      }
      .sidebar.mobile-open {
        transform: translateX(0);
      }
      .main { margin-right: 0; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .mobile-menu-btn { display: inline-flex; }
    }

    .action-btns { display: flex; gap: 8px; }
    .btn-sm { padding: 6px 12px; font-size: 13px; width: auto; }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen">
    <div class="login-card">
      <h2>تسجيل الدخول للنظام</h2>
      <div class="form-group">
        <label>اسم المستخدم</label>
        <input type="text" id="username" class="form-control" placeholder="admin أو user">
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••">
      </div>
      <button class="btn" onclick="handleLogin()">دخول</button>
      <p id="login-error" style="color:var(--danger); text-align:center; margin-top:12px; font-size:14px;"></p>
    </div>
  </div>

  <!-- Sidebar Navigation -->
  <aside class="sidebar">
    <div class="sidebar-header">إدارة الموارد البشرية</div>
    <ul class="sidebar-menu">
      <li><a href="#" onclick="goView('dashboard')" class="active" id="nav-dashboard">لوحة التحكم</a></li>
      <li><a href="#" onclick="goView('workers')" id="nav-workers">الموظفون</a></li>
      <li><a href="#" onclick="goView('leaves')" id="nav-leaves">الإجازات</a></li>
      <li><a href="#" onclick="goView('guards')" id="nav-guards">الحراسات</a></li>
    </ul>
    <div class="sidebar-footer">
      <button class="btn btn-danger btn-sm" onclick="handleLogout()">تسجيل الخروج</button>
    </div>
  </aside>

  <!-- Main Application View -->
  <main class="main">
    <header class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="mobile-menu-btn" onclick="toggleMobileSidebar()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="topbar-title" id="topbar-title">لوحة التحكم</span>
      </div>
      <div id="topbar-actions"></div>
    </header>

    <div class="content" id="main-content">
      <!-- Dynamic Views Loaded Here -->
    </div>
  </main>

  <script>
    let currentUser = null;
    let workersData = [];
    let leavesData = [];
    let guardsData = [];

    async function handleLogin() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      if ((u === 'admin' && p === 'admin123') || (u === 'user' && p === 'user123')) {
        currentUser = { username: u, role: u === 'admin' ? 'admin' : 'user' };
        document.getElementById('login-screen').style.display = 'none';
        await loadAllData();
        goView('dashboard');
      } else {
        document.getElementById('login-error').innerText = 'بيانات الدخول غير صحيحة';
      }
    }

    function handleLogout() {
      currentUser = null;
      document.getElementById('login-screen').style.display = 'flex';
    }

    function toggleMobileSidebar() {
      document.querySelector('.sidebar').classList.toggle('mobile-open');
    }

    async function loadAllData() {
      try {
        const [wRes, lRes, gRes] = await Promise.all([
          fetch('/api/workers'),
          fetch('/api/leaves'),
          fetch('/api/guards')
        ]);
        workersData = await wRes.json();
        leavesData = await lRes.json();
        guardsData = await gRes.json();
      } catch (err) {
        console.error('Failed to load data from server', err);
      }
    }

    function goView(view) {
      document.querySelectorAll('.sidebar-menu a').forEach(el => el.classList.remove('active'));
      const activeNav = document.getElementById(`nav-${view}`);
      if(activeNav) activeNav.classList.add('active');
      document.querySelector('.sidebar').classList.remove('mobile-open');

      const content = document.getElementById('main-content');
      const title = document.getElementById('topbar-title');
      const actions = document.getElementById('topbar-actions');
      actions.innerHTML = '';

      if (view === 'dashboard') {
        title.innerText = 'لوحة التحكم';
        content.innerHTML = `
          <div class="stats-grid">
            <div class="stat-card"><h3>إجمالي الموظفين</h3><div class="value">${workersData.length}</div></div>
            <div class="stat-card"><h3>إجمالي الإجازات</h3><div class="value">${leavesData.length}</div></div>
            <div class="stat-card"><h3>إجمالي الحراسات</h3><div class="value">${guardsData.length}</div></div>
          </div>
        `;
      } else if (view === 'workers') {
        title.innerText = 'إدارة الموظفين';
        if (currentUser.role === 'admin') {
          actions.innerHTML = `<button class="btn btn-sm" onclick="showAddWorkerModal()">إضافة موظف</button>`;
        }
        renderWorkersTable(content);
      } else if (view === 'leaves') {
        title.innerText = 'إدارة الإجازات';
        if (currentUser.role === 'admin') {
          actions.innerHTML = `<button class="btn btn-sm" onclick="showAddLeaveModal()">تسجيل إجازة</button>`;
        }
        renderLeavesTable(content);
      } else if (view === 'guards') {
        title.innerText = 'إدارة الحراسات';
        if (currentUser.role === 'admin') {
          actions.innerHTML = `<button class="btn btn-sm" onclick="showAddGuardModal()">تسجيل حراسة</button>`;
        }
        renderGuardsTable(content);
      }
    }

    function renderWorkersTable(container) {
      let rows = workersData.map(w => `
        <tr>
          <td>${w.id}</td>
          <td>${w.fname} ${w.lname}</td>
          <td>${w.dept || '-'}</td>
          <td>${w.pos || '-'}</td>
          <td>${w.hire || '-'}</td>
          ${currentUser.role === 'admin' ? `<td><button class="btn btn-danger btn-sm" onclick="deleteWorker(${w.id})">حذف</button></td>` : ''}
        </tr>
      `).join('');

      container.innerHTML = `
        <div class="card"><div class="table-container"><table>
          <thead><tr><th>#</th><th>الاسم الكامل</th><th>القسم</th><th>المسمى الوظيفي</th><th>تاريخ التعيين</th>${currentUser.role === 'admin' ? '<th>إجراءات</th>' : ''}</tr></thead>
          <tbody>${rows || '<tr><td colspan="6" style="text-align:center;">لا توجد بيانات</td></tr>'}</tbody>
        </table></div></div>
      `;
    }

    function renderLeavesTable(container) {
      let rows = leavesData.map(l => {
        const worker = workersData.find(w => w.id === l.wid);
        return `
          <tr>
            <td>${worker ? worker.fname + ' ' + worker.lname : 'موظف محذوف'}</td>
            <td>${l.type}</td>
            <td>${l.from}</td>
            <td>${l.to}</td>
            <td>${l.days} يوم</td>
            ${currentUser.role === 'admin' ? `<td><button class="btn btn-danger btn-sm" onclick="deleteLeave(${l.id})">حذف</button></td>` : ''}
          </tr>
        `;
      }).join('');

      container.innerHTML = `
        <div class="card"><div class="table-container"><table>
          <thead><tr><th>الموظف</th><th>نوع الإجازة</th><th>من تاريخ</th><th>إلى تاريخ</th><th>الأيام</th>${currentUser.role === 'admin' ? '<th>إجراءات</th>' : ''}</tr></thead>
          <tbody>${rows || '<tr><td colspan="6" style="text-align:center;">لا توجد إجازات مسجلة</td></tr>'}</tbody>
        </table></div></div>
      `;
    }

    function renderGuardsTable(container) {
      let rows = guardsData.map(g => {
        const worker = workersData.find(w => w.id === g.wid);
        return `
          <tr>
            <td>${worker ? worker.fname + ' ' + worker.lname : 'موظف محذوف'}</td>
            <td>${g.date}</td>
            <td>${g.type}</td>
            <td>${g.note || '-'}</td>
            ${currentUser.role === 'admin' ? `<td><button class="btn btn-danger btn-sm" onclick="deleteGuard(${g.id})">حذف</button></td>` : ''}
          </tr>
        `;
      }).join('');

      container.innerHTML = `
        <div class="card"><div class="table-container"><table>
          <thead><tr><th>الموظف</th><th>التاريخ</th><th>نوع الحراسة</th><th>ملاحظات</th>${currentUser.role === 'admin' ? '<th>إجراءات</th>' : ''}</tr></thead>
          <tbody>${rows || '<tr><td colspan="5" style="text-align:center;">لا توجد حراسات مسجلة</td></tr>'}</tbody>
        </table></div></div>
      `;
    }

    async function deleteWorker(id) {
      if(!confirm('هل أنت متأكد من حذف هذا الموظف؟')) return;
      await fetch(`/api/workers?id=${id}`, { method: 'DELETE' });
      await loadAllData();
      goView('workers');
    }

    async function deleteLeave(id) {
      if(!confirm('هل أنت متأكد من حذف هذه الإجازة؟')) return;
      await fetch(`/api/leaves?id=${id}`, { method: 'DELETE' });
      await loadAllData();
      goView('leaves');
    }

    async function deleteGuard(id) {
      if(!confirm('هل أنت متأكد من حذف سجل الحراسة هذا؟')) return;
      await fetch(`/api/guards?id=${id}`, { method: 'DELETE' });
      await loadAllData();
      goView('guards');
    }

    function showAddWorkerModal() {
      const fname = prompt('الاسم الأول:');
      if(!fname) return;
      const lname = prompt('اسم العائلة:');
      const dept = prompt('القسم:');
      const pos = prompt('المسمى الوظيفي:');
      const hire = prompt('تاريخ التعيين (YYYY-MM-DD):', new Date().toISOString().split('T')[0]);

      fetch('/api/workers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fname, lname, dept, pos, hire })
      }).then(() => { loadAllData().then(() => goView('workers')); });
    }

    function showAddLeaveModal() {
      if(workersData.length === 0) { alert('يجب إضافة موظفين أولاً'); return; }
      const wid = prompt('أدخل معرف الموظف (ID):\n' + workersData.map(w => `${w.id}: ${w.fname} ${w.lname}`).join('\n'));
      if(!wid) return;
      const type = prompt('نوع الإجازة (قصيرة / طويلة):', 'قصيرة');
      const from = prompt('من تاريخ (YYYY-MM-DD):');
      const to = prompt('إلى تاريخ (YYYY-MM-DD):');
      const days = prompt('عدد الأيام:');
      const note = prompt('ملاحظات (اختياري):');

      fetch('/api/leaves', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ wid: parseInt(wid), type, from, to, days: parseInt(days), note })
      }).then(() => { loadAllData().then(() => goView('leaves')); });
    }

    function showAddGuardModal() {
      if(workersData.length === 0) { alert('يجب إضافة موظفين أولاً'); return; }
      const wid = prompt('أدخل معرف الموظف (ID):\n' + workersData.map(w => `${w.id}: ${w.fname} ${w.lname}`).join('\n'));
      if(!wid) return;
      const date = prompt('التاريخ (YYYY-MM-DD):');
      const type = prompt('نوع الحراسة:', 'ليلي');
      const note = prompt('ملاحظات (اختياري):');

      fetch('/api/guards', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ wid: parseInt(wid), date, type, note })
      }).then(() => { loadAllData().then(() => goView('guards')); });
    }
  </script>
</body>
</html>
